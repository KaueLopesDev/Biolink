<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ── SEO ──────────────────────────────────────────────────────── -->
    <!-- Corrigido: era apenas "Sinixtro" -->
    <title>Sinixtro.XL — Conteúdo Geek de Verdade</title>
    <meta name="description" content="Teorias, mistérios e a análise dos momentos mais marcantes da cultura pop japonesa. Do vermelho e azul deles, fiz meu roxo.">
    <meta name="theme-color" content="#7c3aed">

    <!-- ── Open Graph ────────────────────────────────────────────────── -->
    <meta property="og:title" content="Sinixtro.XL">
    <meta property="og:description" content="Do vermelho e azul deles, fiz meu roxo. Conteúdo geek de verdade.">
    <meta property="og:image" content="imagens/Foto-Perfil.jpeg">
    <meta property="og:type" content="website">

    <!-- ── Twitter Card ──────────────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Sinixtro.XL">
    <meta name="twitter:description" content="Do vermelho e azul deles, fiz meu roxo. Conteúdo geek de verdade.">
    <meta name="twitter:image" content="imagens/Foto-Perfil.jpeg">

    <!-- ── Favicon ───────────────────────────────────────────────────── -->
    <!-- Corrigido: removido "/" inicial que quebrava no GitHub Pages -->
    <link rel="shortcut icon" href="imagens/favicon.ico" type="image/x-icon">

    <!-- ── Google Fonts ──────────────────────────────────────────────── -->
    <!-- Orbitron: título display geek/sci-fi | Inter: corpo legível -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="estilo/style.css">
</head>
<body>

    <!-- Cursor customizado — CSS oculta em touch, exibe só com mouse -->
    <div id="cursor" aria-hidden="true"></div>
    <div id="cursor-brilho" aria-hidden="true"></div>

    <!-- ── Fundo animado ──────────────────────────────────────────────── -->
    <div id="midiaBackground">
        <!-- Fallback estático enquanto o vídeo não carrega (ou em reduced-motion/saveData) -->
        <img
            src="imagens/Fundo.jpeg"
            alt=""
            role="presentation"
            width="1920"
            height="1080"
            loading="eager"
        >
    </div>

    <!-- Overlay: roxo translúcido no topo, escuro na base — contraste cinematográfico -->
    <div id="overlay" aria-hidden="true"></div>

    <!-- Partículas decorativas (canvas; JS controla ativação) -->
    <canvas id="particulas" aria-hidden="true"></canvas>

    <!-- ── Card principal ────────────────────────────────────────────── -->
    <div id="card">

        <header id="cabecalho">

            <!-- Avatar com anel gradiente e glow roxo pulsante -->
            <div id="perfil-wrapper" class="entrada" style="--atraso-entrada: 0">
                <img
                    src="imagens/Foto-Perfil.jpeg"
                    alt="Foto de perfil de Sinixtro.XL"
                    id="Perfil"
                    width="220"
                    height="220"
                    loading="eager"
                >
            </div>

            <!-- Nome + linha gradiente decorativa -->
            <div class="nome-wrapper entrada" style="--atraso-entrada: 1">
                <h1>Sinixtro.XL</h1>
                <div class="linha-gradiente" aria-hidden="true"></div>
                <!-- Selo "NOVO" injetado via JS quando MOSTRAR_NOVO_VIDEO = true -->
            </div>

            <!-- Bio: texto original preservado para SEO e leitores de tela -->
            <div class="bio-wrapper entrada" style="--atraso-entrada: 2">

                <!-- Visível apenas para leitores de tela (oculto visualmente) -->
                <p class="bio-principal sr-only">
                    🍜 Conteúdo Geek de Verdade: Teorias, mistérios e a análise dos momentos mais marcantes da cultura pop japonesa.
                </p>

                <!-- Typewriter visual: decorativo, invisível para leitores de tela -->
                <p class="bio-typewriter" aria-hidden="true">
                    <span id="typewriter-texto"></span><span class="cursor-typewriter">|</span>
                </p>

                <p class="bio-frase">Do vermelho e azul deles, fiz meu roxo.</p>
            </div>

            <!-- Ícones sociais do topo -->
            <nav id="cima" aria-label="Redes sociais" class="entrada" style="--atraso-entrada: 3">

                <!-- Corrigido: era /imagens/instagram.png (barra inicial quebrava no GitHub Pages) -->
                <!-- Corrigido: adicionado rel="noopener noreferrer" e aria-label -->
                <a
                    href="https://www.instagram.com/sinixtro.xl"
                    rel="noopener noreferrer external"
                    target="_blank"
                    aria-label="Instagram de Sinixtro.XL"
                    class="icone-social icone-instagram"
                >
                    <img src="imagens/instagram.png" alt="" aria-hidden="true" class="icones" width="40" height="40">
                </a>

                <!-- Corrigido: removido ?_r=1 da URL -->
                <a
                    href="https://www.tiktok.com/@sinixtrooo"
                    rel="noopener noreferrer external"
                    target="_blank"
                    aria-label="TikTok de Sinixtro.XL"
                    class="icone-social icone-tiktok"
                >
                    <img src="imagens/tik-tok.png" alt="" aria-hidden="true" class="icones" width="40" height="40">
                </a>

                <a
                    href="https://www.youtube.com/@SINIXTRO.XL1"
                    rel="noopener noreferrer external"
                    target="_blank"
                    aria-label="YouTube de Sinixtro.XL"
                    class="icone-social icone-youtube"
                >
                    <img src="imagens/youtube.png" alt="" aria-hidden="true" class="icones" width="40" height="40">
                </a>

            </nav>

        </header>

        <main>
            <!--
                ═══════════════════════════════════════════════════════════════
                ÁREA PROTEGIDA — main > nav#baixo
                Alterações realizadas APENAS dentro do permitido:
                  • rel="noopener noreferrer" adicionado aos links externos
                  • :focus-visible (no CSS)
                  • Correção do bug de CSS em .divulgacao (background inválido)
                  • Animação de entrada escalonada via --atraso (CSS)
                NÃO foram alterados: quantidade, ordem, textos/rótulos,
                destinos (incluindo mailto), avatares nem rel="external".
                ═══════════════════════════════════════════════════════════════
            -->
            <nav id="baixo">

                <a href="https://www.youtube.com/@SINIXTRO.XL1" rel="noopener noreferrer external" target="_blank">
                    <div class="divulgacao" style="--atraso:0">
                        <img src="imagens/Mini-deku.jpeg" alt="Deku" class="mini">
                        <p>Youtube</p>
                    </div>
                </a>

                <a href="https://www.youtube.com/@sinixtro_games" target="_blank" rel="noopener noreferrer external">
                    <div class="divulgacao" style="--atraso:1">
                        <img src="imagens/Mini-levi.jpeg" alt="Levi" class="mini">
                        <p>Youtube Games</p>
                    </div>
                </a>

                <a href="https://www.tiktok.com/@sinixtrooo?_r=" rel="noopener noreferrer external" target="_blank">
                    <div class="divulgacao" style="--atraso:2">
                        <img src="imagens/Mini-goku.jpeg" alt="Goku criança" class="mini">
                        <p>TikTok</p>
                    </div>
                </a>

                <a href="https://www.instagram.com/sinixtro.xl" rel="noopener noreferrer external" target="_blank">
                    <div class="divulgacao" style="--atraso:3">
                        <img src="imagens/Mini-gon.jpeg" alt="Mini-gon" class="mini">
                        <p>Instagram</p>
                    </div>
                </a>

                <a href="mailto:miguelnascimento6400@gmail.com" target="_blank" rel="external">
                    <div class="divulgacao" id="gmail" style="--atraso:4">
                        <img src="imagens/Mini-higuruma.jpeg" alt="Higuruma na frente de um carro" class="mini">
                        <p>Gmail</p>
                    </div>
                </a>

            </nav>
        </main>

        <footer>
            <p>Feito por <a href="https://github.com/KaueLopesDev" rel="noopener noreferrer external" target="_blank">Kauê</a></p>
        </footer>

    </div><!-- /#card -->

    <!-- Botão de som do vídeo (oculto por padrão; JS exibe ao carregar o vídeo) -->
    <button
        id="btn-som"
        aria-label="Ativar som do vídeo"
        title="Ativar som do vídeo"
    >
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18" aria-hidden="true">
            <!-- Ícone atualizado via JS (mudo/com som) -->
            <path id="icone-som-path" d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
        </svg>
    </button>

    <!--
        CÓDIGO MORTO SINALIZADO — NÃO remover sem confirmar com o criador.
        copiarTexto() e #copiar parecem não ser usados pelo fluxo atual
        (o Gmail usa mailto: diretamente). Mantidos para preservar histórico.
        <span id="copiar" style="display:none">miguelnascimento6400@gmail.com</span>
        <span id="mensagem" style="display:none">E-mail copiado!</span>
    -->

    <script src="script.js"></script>
</body>
</html>
